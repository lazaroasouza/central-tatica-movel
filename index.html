<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DedroneTracker.AI - Central Tática Móvel</title>
    
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkRlZHJvbmVUcmFja2VyLkFJIiwKICAic2hvcnRfbmFtZSI6ICJEZWRyb25lQzIiLAogICJzdGFydF91cmwiOiAiLi8iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwNDBhMTEiLAogICJ0aGVtZV9jb2xvciI6ICIjMGIxMTIwIgp9">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-dark: #070a11;
            --panel-bg: rgba(13, 20, 36, 0.95);
            --border-color: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-red: #f43f5e;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { height: 100vh; width: 100vw; font-family: 'Segoe UI', monospace; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

        /* HEADER TÁTICO */
        #header {
            height: 50px;
            background: #0b1120;
            border-bottom: 2px solid #0284c7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 2000;
        }
        .logo { font-weight: 900; font-size: 15px; color: #fff; letter-spacing: 1px; }
        .logo span { color: var(--accent-cyan); }
        .status-container { display: flex; gap: 8px; }
        .status-badge { font-size: 11px; color: var(--accent-green); background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--accent-green); }
        .offline-badge { color: var(--accent-yellow); background: rgba(245, 158, 11, 0.1); border-color: var(--accent-yellow); }

        /* LAYOUT PRINCIPAL */
        #wrapper { display: flex; height: calc(100vh - 50px); width: 100vw; }

        /* PAINEL LATERAL */
        #sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            padding: 15px;
            gap: 15px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .panel-block {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .panel-title { font-size: 11px; font-weight: bold; color: var(--accent-cyan); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .target-data { font-size: 12px; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .target-data span { color: var(--text-main); font-weight: bold; }

        .btn-tac {
            background: #0284c7;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.3);
            margin-bottom: 8px;
        }
        .btn-tac:hover { background: #0369a1; }

        /* MAPA VISÍVEL */
        #map-container { flex: 1; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; background: #070a11; }

        .leaflet-control-layers {
            background: rgba(15, 23, 42, 0.9) !important;
            color: #fff !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 6px !important;
            padding: 8px !important;
        }

        /* MODAL MIRA ÓPTICA (HUD) */
        #camera-hud-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 5000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #camera-video { width: 100%; height: 100%; object-fit: cover; }
        .hud-crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 240px;
            border: 2px solid rgba(56, 189, 248, 0.6);
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hud-crosshair::before { content: ''; position: absolute; width: 8px; height: 8px; background: var(--accent-red); border-radius: 50%; }
        .hud-controls { position: absolute; bottom: 30px; display: flex; gap: 10px; width: 80%; max-width: 400px; z-index: 5001; }
    </style>
</head>
<body>

    <div id="header">
        <div class="logo"><span>[✖] DEDRONE</span> TRACKER.AI — COMMAND</div>
        <div class="status-container">
            <div class="status-badge" id="net-status">● ONLINE</div>
            <div class="status-badge" id="gps-status">● GPS BUSCANDO...</div>
        </div>
    </div>

    <div id="wrapper">
        <div id="sidebar">
            <div class="panel-block">
                <div class="panel-title">MONITORAMENTO DE AMEAÇAS</div>
                <div class="target-data">
                    <div>ALERTAS: <span style="color:var(--accent-green)">0 ATIVOS</span></div>
                    <div>PRECISÃO GPS: <span id="gps-accuracy">-- m</span></div>
                    <div>COORDENADAS: <span id="gps-coords">Buscando...</span></div>
                    <div>RAIO OPERACIONAL: <span>30 KM</span></div>
                </div>
            </div>

            <div class="panel-block">
                <div class="panel-title">DETALHES DO ALVO</div>
                <div class="target-data">
                    <div>ID: <span>--</span></div>
                    <div>MODELO: <span>--</span></div>
                    <div>ALTITUDE: <span>-- m</span></div>
                    <div>VELOCIDADE: <span>-- km/h</span></div>
                </div>
            </div>

            <div style="margin-top: auto;">
                <button class="btn-tac" onclick="requestHighAccuracyGPS()">🎯 FORÇAR RECALCULO GPS</button>
                <button class="btn-tac" style="background:#0284c7;" onclick="openCameraHUD()">📷 ATIVAR MIRA ÓPTICA (HUD)</button>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- MODAL CAMERA HUD -->
    <div id="camera-hud-modal">
        <video id="camera-video" autoplay playsinline></video>
        <div class="hud-crosshair"></div>
        <div class="hud-controls">
            <button class="btn-tac" style="background:#9f1239; border-color:#f43f5e;" onclick="closeCameraHUD()">✖ FECHAR MIRA</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // SERVICE WORKER PARA SUPORTE OFFLINE
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'c2-tactical-offline-v2';
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(response => {
                            if (response) return response;
                            return fetch(e.request).then(netRes => {
                                if (netRes.status === 200 && (e.request.url.includes('tile') || e.request.url.includes('arcgis') || e.request.url.includes('unpkg'))) {
                                    let clone = netRes.clone();
                                    caches.open(CACHE_NAME).then(c => c.put(e.request, clone));
                                }
                                return netRes;
                            }).catch(() => caches.match(e.request));
                        })
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }

        // REDE ONLINE / OFFLINE
        function updateNetworkStatus() {
            const netStatus = document.getElementById('net-status');
            if (navigator.onLine) {
                netStatus.innerHTML = "● ONLINE";
                netStatus.classList.remove('offline-badge');
            } else {
                netStatus.innerHTML = "⚠️ MODO OFFLINE";
                netStatus.classList.add('offline-badge');
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // MAPAS DE ALTA DEFINIÇÃO
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap, © CARTO'
        });

        const map = L.map('map', { 
            zoomControl: true,
            layers: [satelliteLayer] 
        }).setView([-17.0822, -40.9352], 12);

        const baseMaps = {
            "🛰️ Satélite Híbrido": satelliteLayer,
            "🗺️ Mapa Urbano Tático": darkLayer
        };
        L.control.layers(baseMaps).addTo(map);

        // VARIÁVEIS DE LOCALIZAÇÃO DE ALTA PRECISÃO
        let userMarker = null;
        let accuracyCircle = null;
        let tacticalCircle = null;
        let userCoords = null;
        let watchId = null;

        const baseIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:#0284c7; width:18px; height:18px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 12px #38bdf8;'></div>",
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        const geoOptions = {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        };

        function startLocationWatch() {
            if ("geolocation" in navigator) {
                if (watchId) navigator.geolocation.clearWatch(watchId);

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = Math.round(position.coords.accuracy);
                        userCoords = [lat, lng];

                        document.getElementById('gps-status').innerHTML = "● GPS ALTA PRECISÃO";
                        document.getElementById('gps-coords').innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                        document.getElementById('gps-accuracy').innerText = `${accuracy} m`;

                        if (!userMarker) {
                            userMarker = L.marker(userCoords, { icon: baseIcon }).addTo(map).bindPopup("<b>BASE MÓVEL OPERACIONAL</b>");
                            
                            // Círculo de Erro/Precisão do GPS
                            accuracyCircle = L.circle(userCoords, {
                                color: '#f43f5e',
                                fillColor: '#f43f5e',
                                fillOpacity: 0.15,
                                radius: accuracy
                            }).addTo(map);

                            // Raio Tático de 30 KM
                            tacticalCircle = L.circle(userCoords, {
                                color: '#38bdf8',
                                fillColor: '#0284c7',
                                fillOpacity: 0.08,
                                radius: 30000
                            }).addTo(map);

                            map.setView(userCoords, 13);
                        } else {
                            userMarker.setLatLng(userCoords);
                            accuracyCircle.setLatLng(userCoords).setRadius(accuracy);
                            tacticalCircle.setLatLng(userCoords);
                        }
                    },
                    (error) => {
                        document.getElementById('gps-status').innerHTML = "⚠️ ERRO DE LOCALIZAÇÃO";
                        document.getElementById('gps-coords').innerText = "Bloqueado / Sem sinal";
                    },
                    geoOptions
                );
            }
        }

        function requestHighAccuracyGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    userCoords = [lat, lng];
                    if (userMarker) {
                        userMarker.setLatLng(userCoords);
                        tacticalCircle.setLatLng(userCoords);
                    }
                    map.flyTo(userCoords, 14, { animate: true, duration: 1.5 });
                }, () => {}, geoOptions);
            }
        }

        startLocationWatch();

        // CONTROLE CÂMERA HUD
        let mediaStream = null;
        async function openCameraHUD() {
            const modal = document.getElementById('camera-hud-modal');
            const video = document.getElementById('camera-video');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = mediaStream;
                modal.style.display = 'flex';
            } catch (err) {
                alert("Não foi possível acessar a câmera do dispositivo.");
            }
        }

        function closeCameraHUD() {
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            document.getElementById('camera-hud-modal').style.display = 'none';
        }
    </script>
</body>
</html>
