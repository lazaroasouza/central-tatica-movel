<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DedroneTracker.AI - C2 Multisensor</title>
    
    <meta name="theme-color" content="#030712">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-base: #030712;
            --glass-bg: rgba(17, 24, 39, 0.6);
            --glass-border: rgba(56, 189, 248, 0.2);
            --cyan: #38bdf8;
            --cyan-glow: rgba(56, 189, 248, 0.5);
            --red: #f43f5e;
            --green: #10b981;
            --yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --font-ui: 'Rajdhani', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; font-family: var(--font-ui); background: var(--bg-base); color: var(--text-main); overflow: hidden; position: fixed; }

        /* HEADER TECNOLÓGICO */
        #header {
            position: absolute; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px; z-index: 4000;
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between; padding: 10px 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .logo { font-family: var(--font-mono); font-size: 14px; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 12px; height: 12px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan); animation: pulse 2s infinite; }
        
        .status-container { display: flex; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .status-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .status-badge { font-family: var(--font-mono); font-size: 10px; display: flex; align-items: center; gap: 4px; color: var(--text-muted); }
        .status-badge.ready { color: var(--green); }

        /* MAPA BASE */
        #app-container { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: flex; width: 100%; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #030712; z-index: 1000; }
        
        /* FILTRO DE GRID NO MAPA PARA ESTILO TÁTICO */
        #map::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1500; pointer-events: none;
            background-image: linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* PAINEL LATERAL FLUTUANTE */
        #sidebar {
            position: absolute; top: calc(60px + env(safe-area-inset-top, 0px)); left: 10px; bottom: max(20px, env(safe-area-inset-bottom, 20px));
            width: 340px; background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            display: flex; flex-direction: column; z-index: 3000; padding: 15px; gap: 15px;
            overflow-y: auto; box-shadow: 2px 0 20px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* WIDGETS DO PAINEL */
        .widget {
            background: rgba(3, 7, 18, 0.5); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 12px; position: relative; overflow: hidden;
        }
        .widget::before { content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: var(--cyan); }
        .widget-alert::before { background: var(--red); box-shadow: 0 0 10px var(--red); }
        
        .widget-header { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--cyan); margin-bottom: 10px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .data-label { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
        .data-val { font-size: 14px; font-weight: 700; color: #fff; font-family: var(--font-mono); }
        .data-val.alert { color: var(--red); text-shadow: 0 0 8px rgba(244, 63, 94, 0.5); }

        /* BOTÕES CYBERPUNK */
        .btn-cyber {
            background: linear-gradient(90deg, rgba(15,23,42,0.8), rgba(30,41,59,0.8)); border: 1px solid var(--glass-border);
            color: #fff; padding: 12px 15px; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase;
            border-radius: 8px; cursor: pointer; width: 100%; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .btn-cyber::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: 0.5s; }
        .btn-cyber:active::after { left: 100%; }
        
        .btn-cyber.active { border-color: var(--cyan); background: rgba(14, 165, 233, 0.1); box-shadow: inset 0 0 15px rgba(14, 165, 233, 0.2); }
        .btn-cyber.active .indicator { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
        .indicator { color: var(--text-muted); font-weight: bold; }
