<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DedroneTracker.AI - C2 Multisensor</title>
    
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- TENSORFLOW.JS (Inteligência Artificial) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        :root {
            --bg-dark: #070a11;
            --panel-bg: rgba(13, 20, 36, 0.95);
            --border-color: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-red: #f43f5e;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { height: 100vh; width: 100vw; font-family: 'Segoe UI', monospace; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

        /* HEADER */
        #header {
            height: 50px; background: #0b1120; border-bottom: 2px solid #0284c7;
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 3000;
        }
        .logo { font-weight: 900; font-size: 13px; color: #fff; }
        .logo span { color: var(--accent-cyan); }
        .status-container { display: flex; gap: 6px; }
        .status-badge { font-size: 10px; color: var(--accent-green); background: rgba(16,185,129,0.1); padding: 4px 6px; border-radius: 4px; border: 1px solid var(--accent-green); }

        /* LAYOUT & MAPA */
        #wrapper { display: flex; height: calc(100vh - 50px); width: 100vw; position: relative; }
        #map-container { flex: 1; height: 100%; width: 100%; position: relative; }
        #map { width: 100%; height: 100%; background: #070a11; }

        /* PAINEL TÁTICO */
        #sidebar {
            width: 340px; background: var(--panel-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; z-index: 2000; padding: 12px; gap: 10px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); transition: transform 0.3s ease-in-out;
            overflow-y: auto;
        }
        .panel-block { background: rgba(30,41,59,0.4); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; }
        .panel-title { font-size: 11px; font-weight: bold; color: var(--accent-cyan); margin-bottom: 6px; }
        .target-data { font-size: 11px; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .target-data span { color: var(--text-main); font-weight: bold; }

        /* BOTOES */
        .btn-sensor { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 8px; font-size: 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 5px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .btn-sensor.active { background: rgba(16,185,129,0.2); border-color: var(--accent-green); color: var(--accent-green); }
        .btn-sensor.scanning { background: rgba(245,158,11,0.2); border-color: var(--accent-yellow); color: var(--accent-yellow); }
        
        .btn-tac { background: #0284c7; border: 1px solid #38bdf8; color: #fff; padding: 10px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; text-transform: uppercase; }

        /* BOTÃO FLUTUANTE MAPA */
        #locate-btn { position: absolute; bottom: 30px; right: 15px; z-index: 2500; background: #0284c7; border: 2px solid #38bdf8; color: white; padding: 12px; border-radius: 30px; font-size: 11px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* RESPONSIVIDADE MOBILE */
        #toggle-panel-btn { display: none; }
        @media (max-width: 768px) {
            #sidebar { position: absolute; bottom: 0; left: 0; width: 100%; max-height: 75vh; border-top: 2px solid #0284c7; border-radius: 12px 12px 0 0; transform: translateY(calc(100% - 40px)); }
            #sidebar.open { transform: translateY(0); }
            #toggle-panel-btn { display: block; background: #0b1120; color: var(--accent-cyan); border: 1px solid var(--border-color); padding: 6px; text-align: center; font-size: 10px; border-radius: 4px; margin-bottom: 4px; }
        }

        /* MODAL MIRA IA (HUD) */
        #camera-hud-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 5000; display: none; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #ai-canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5001; pointer-events: none; }
        .hud-overlay { position: absolute; top: 20px; left: 20px; z-index: 5002; color: var(--accent-red); font-weight: bold; font-size: 14px; text-shadow: 0 0 5px #000; }
        .hud-controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 5002; width: 80%; max-width: 300px; }
    </style>
</head>
<body>

    <div id="header">
        <div class="logo"><span>[✖] MULTISENSOR</span> C2 TÁTICO</div>
        <div class="status-container">
            <div class="status-badge" id="ai-status">🧠 IA INICIANDO...</div>
            <div class="status-badge" id="gps-status">● GPS BUSCANDO</div>
        </div>
    </div>

    <div id="wrapper">
        <div id="sidebar">
            <div id="toggle-panel-btn" onclick="toggleSidebar()">▼ ABRIR / FECHAR PAINEL</div>

            <div class="panel-block">
                <div class="panel-title">📡 MÓDULOS DE DETECÇÃO (SENSORES)</div>
                <button class="btn-sensor" id="btn-audio" onclick="toggleAcousticRadar()">
                    <span>🔊 RADAR ACÚSTICO (SONAR)</span> <span id="audio-status">OFF</span>
                </button>
                <button class="btn-sensor" id="btn-ble" onclick="scanBluetooth()">
                    <span>📶 SCANNER BLUETOOTH (REMOTE ID)</span> <span>SCAN</span>
                </button>
            </div>

            <div class="panel-block">
                <div class="panel-title">⚠️ ALVO DETECTADO</div>
                <div class="target-data">
                    <div>FONTE: <span id="tgt-source" style="color:var(--accent-red)">NENHUMA</span></div>
                    <div>CONFIANÇA: <span id="tgt-conf">--%</span></div>
                    <div>FREQUÊNCIA/ID: <span id="tgt-freq">--</span></div>
                    <div>DIST. ESTIMADA: <span id="tgt-dist">-- m</span></div>
                </div>
            </div>

            <div class="panel-block">
                <div class="panel-title">📍 SEU POSICIONAMENTO</div>
                <div class="target-data">
                    <div>COORD: <span id="gps-coords">Buscando...</span></div>
                    <div>PRECISÃO: <span id="gps-accuracy">-- m</span></div>
                </div>
            </div>

            <button class="btn-tac" style="background:#0284c7;" onclick="openCameraHUD()">📷 ATIVAR MIRA COM INTELIGÊNCIA ARTIFICIAL</button>
        </div>

        <div id="map-container">
            <button id="locate-btn" onclick="centerOnGPS()">🎯 CENTRALIZAR</button>
            <div id="map"></div>
        </div>
    </div>

    <!-- HUD COM IA -->
    <div id="camera-hud-modal">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="ai-canvas"></canvas>
        <div class="hud-overlay" id="hud-alert">Buscando assinaturas visuais...</div>
        <div class="hud-controls">
            <button class="btn-tac" style="background:#9f1239; border-color:#f43f5e;" onclick="closeCameraHUD()">✖ FECHAR MIRA TÁTICA</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 1. MAPA E GPS (MANTIDO E OTIMIZADO)
        // ==========================================
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
        const map = L.map('map', { zoomControl: false, layers: [satelliteLayer] }).setView([-17.25, -41.00], 15);
        L.control.zoom({ position: 'topright' }).addTo(map);

        let userCoords = null;
        let userMarker = null;

        const baseIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:#0284c7; width:20px; height:20px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 15px #38bdf8;'></div>",
            iconSize: [20, 20], iconAnchor: [10, 10]
        });

        navigator.geolocation.watchPosition(pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            document.getElementById('gps-status').innerText = "● GPS OK";
            document.getElementById('gps-coords').innerText = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            document.getElementById('gps-accuracy').innerText = `${Math.round(pos.coords.accuracy)} m`;
            
            if(!userMarker) {
                userMarker = L.marker(userCoords, {icon: baseIcon}).addTo(map);
                map.setView(userCoords, 16);
            } else {
                userMarker.setLatLng(userCoords);
            }
        }, err => console.error(err), { enableHighAccuracy: true });

        function centerOnGPS() { if(userCoords) map.flyTo(userCoords, 17, {animate: true}); }

        // ==========================================
        // 2. IA DE VISÃO COMPUTACIONAL (TENSORFLOW)
        // ==========================================
        let aiModel = null;
        let isDetecting = false;
        let videoEl = document.getElementById('camera-video');
        let canvasEl = document.getElementById('ai-canvas');
        let ctx = canvasEl.getContext('2d');

        // Carrega o modelo de IA leve (COCO-SSD) ao abrir o app
        cocoSsd.load().then(model => {
            aiModel = model;
            document.getElementById('ai-status').innerText = "● IA OPERACIONAL";
            document.getElementById('ai-status').style.color = "var(--accent-green)";
        });

        async function openCameraHUD() {
            document.getElementById('camera-hud-modal').style.display = 'block';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                videoEl.srcObject = stream;
                videoEl.onloadedmetadata = () => {
                    canvasEl.width = videoEl.videoWidth;
                    canvasEl.height = videoEl.videoHeight;
                    isDetecting = true;
                    detectFrame();
                };
            } catch(e) { alert("Erro na câmera: " + e); }
        }

        function closeCameraHUD() {
            isDetecting = false;
            let stream = videoEl.srcObject;
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('camera-hud-modal').style.display = 'none';
        }

        async function detectFrame() {
            if (!isDetecting || !aiModel) return;
            
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
            const predictions = await aiModel.detect(videoEl);
            
            let droneSpotted = false;
            
            predictions.forEach(pred => {
                // Como não temos um modelo treinado SÓ para drones nativamente, 
                // mapeamos objetos voadores genéricos ou anomalias (pássaros, aviões, pipas).
                if (['bird', 'airplane', 'kite'].includes(pred.class)) {
                    droneSpotted = true;
                    ctx.beginPath();
                    ctx.rect(...pred.bbox);
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#f43f5e'; // Vermelho alvo
                    ctx.stroke();
                    
                    ctx.fillStyle = '#f43f5e';
                    ctx.fillText(`POSSÍVEL DRONE / UAV - ${(pred.score*100).toFixed(1)}%`, pred.bbox[0], pred.bbox[1] > 10 ? pred.bbox[1] - 5 : 10);

                    // Atualiza Painel
                    document.getElementById('tgt-source').innerText = "VISUAL (IA ÓPTICA)";
                    document.getElementById('tgt-conf').innerText = `${(pred.score*100).toFixed(1)}%`;
                }
            });

            if(droneSpotted) {
                document.getElementById('hud-alert').innerText = "⚠️ ANOMALIA AÉREA DETECTADA NA LINHA DE VISÃO!";
                document.getElementById('hud-alert').style.color = "#f43f5e";
            } else {
                document.getElementById('hud-alert').innerText = "Escaneando setor visual...";
                document.getElementById('hud-alert').style.color = "#38bdf8";
            }

            requestAnimationFrame(detectFrame);
        }

        // ==========================================
        // 3. RADAR ACÚSTICO (SONAR - WEB AUDIO API)
        // ==========================================
        let audioCtx, analyser, audioStream, audioInterval;
        let isAudioActive = false;

        async function toggleAcousticRadar() {
            const btn = document.getElementById('btn-audio');
            const status = document.getElementById('audio-status');

            if (isAudioActive) {
                // Desligar
                clearInterval(audioInterval);
                audioStream.getTracks().forEach(t => t.stop());
                audioCtx.close();
                isAudioActive = false;
                btn.classList.remove('active');
                status.innerText = "OFF";
                document.getElementById('tgt-source').innerText = "NENHUMA";
                return;
            }

            try {
                // Ligar
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                
                const source = audioCtx.createMediaStreamSource(audioStream);
                source.connect(analyser);
                
                isAudioActive = true;
                btn.classList.add('active');
                status.innerText = "LIGADO";

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                audioInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    // Drones emitem ruidos de alta frequência devido a rotação (RPM).
                    // Analisamos os "bins" de frequencia mais altos.
                    let sum = 0;
                    for(let i = 200; i < 300; i++) { sum += dataArray[i]; }
                    let averageHighFreq = sum / 100;

                    if (averageHighFreq > 60) { // Limiar de detecção
                        document.getElementById('tgt-source').innerText = "SONAR (ACÚSTICO)";
                        document.getElementById('tgt-conf').innerText = `${Math.min(100, averageHighFreq).toFixed(1)}%`;
                        document.getElementById('tgt-freq').innerText = "Rotores Alta RPM";
                        btn.style.backgroundColor = "rgba(244, 63, 94, 0.4)"; // Fica vermelho se ouvir algo
                    } else {
                        btn.style.backgroundColor = "";
                    }
                }, 500);

            } catch(e) { alert("Permissão de microfone negada."); }
        }

        // ==========================================
        // 4. SCANNER BLUETOOTH (REMOTE ID BASE)
        // ==========================================
        async function scanBluetooth() {
            const btn = document.getElementById('btn-ble');
            btn.classList.add('scanning');
            btn.querySelector('span:last-child').innerText = "BUSCANDO...";
            
            try {
                // Requer interação do usuário e HTTPS.
                // O Remote ID usa protocolos de Broadcast específicos (Legacy/Extended).
                // Aqui abrimos o módulo de varredura nativo do OS para o operador.
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['battery_service'] // Exemplo
                });
                
                document.getElementById('tgt-source').innerText = "RF / BLUETOOTH";
                document.getElementById('tgt-freq').innerText = device.name || "MAC " + device.id.substring(0,8);
                document.getElementById('tgt-dist').innerText = "Sinal Forte (< 100m)";
                document.getElementById('tgt-conf').innerText = "100%";
                
                alert(`Sinal Suspeito Capturado: ${device.name || 'Dispositivo Desconhecido'}`);
                
            } catch(error) {
                console.log(error); // Usuário cancelou ou sem suporte
            } finally {
                btn.classList.remove('scanning');
                btn.querySelector('span:last-child').innerText = "SCAN";
            }
        }

        // Drawer Mobile
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    </script>
</body>
</html>
