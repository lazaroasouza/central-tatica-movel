<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DedroneTracker.AI - Central Tática Móvel</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-dark: #070a11;
            --panel-bg: rgba(13, 20, 36, 0.95);
            --border-color: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-red: #f43f5e;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { height: 100vh; width: 100vw; font-family: 'Segoe UI', monospace; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

        /* HEADER TÁTICO */
        #header {
            height: 50px;
            background: #0b1120;
            border-bottom: 2px solid #0284c7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 2000;
        }
        .logo { font-weight: 900; font-size: 15px; color: #fff; letter-spacing: 1px; }
        .logo span { color: var(--accent-cyan); }
        .status-badge { font-size: 11px; color: var(--accent-green); background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--accent-green); }

        /* LAYOUT PRINCIPAL */
        #wrapper { display: flex; height: calc(100vh - 50px); width: 100vw; }

        /* PAINEL LATERAL */
        #sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            padding: 15px;
            gap: 15px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .panel-block {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .panel-title { font-size: 11px; font-weight: bold; color: var(--accent-cyan); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .target-data { font-size: 12px; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .target-data span { color: var(--text-main); font-weight: bold; }

        .btn-tac {
            background: #0284c7;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.3);
        }
        .btn-tac:hover { background: #0369a1; }

        /* MAPA COM FILTRO TÁTICO ESCURO */
        #map-container { flex: 1; height: 100%; position: relative; }
        #map { 
            width: 100%; 
            height: 100%; 
            background: #070a11;
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* MODAL MIRA ÓPTICA (HUD) */
        #camera-hud-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 5000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #camera-video { width: 100%; height: 100%; object-fit: cover; }
        .hud-crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 240px;
            border: 2px solid rgba(56, 189, 248, 0.6);
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hud-crosshair::before { content: ''; position: absolute; width: 8px; height: 8px; background: var(--accent-red); border-radius: 50%; }
        .hud-controls { position: absolute; bottom: 30px; display: flex; gap: 10px; width: 80%; max-width: 400px; z-index: 5001; }
    </style>
</head>
<body>

    <div id="header">
        <div class="logo"><span>[✖] DEDRONE</span> TRACKER.AI — COMMAND</div>
        <div class="status-badge">● MÓDULO OPERACIONAL ONLINE</div>
    </div>

    <div id="wrapper">
        <div id="sidebar">
            <div class="panel-block">
                <div class="panel-title">MONITORAMENTO DE AMEAÇAS</div>
                <div class="target-data">
                    <div>ALERTAS: <span style="color:var(--accent-green)">0 ATIVOS</span></div>
                    <div>SINAL: <span>100%</span></div>
                    <div>GPS BASE: <span>ÁGUAS FORMOSAS</span></div>
                    <div>MODO: <span>TÁTICO MÓVEL</span></div>
                </div>
            </div>

            <div class="panel-block">
                <div class="panel-title">DETALHES DO ALVO</div>
                <div class="target-data">
                    <div>ID: <span>--</span></div>
                    <div>MODELO: <span>--</span></div>
                    <div>ALTITUDE: <span>-- m</span></div>
                    <div>VELOCIDADE: <span>-- km/h</span></div>
                </div>
            </div>

            <div style="margin-top: auto;">
                <button class="btn-tac" onclick="openCameraHUD()">📷 ATIVAR MIRA ÓPTICA (HUD)</button>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- MODAL CAMERA HUD -->
    <div id="camera-hud-modal">
        <video id="camera-video" autoplay playsinline></video>
        <div class="hud-crosshair"></div>
        <div class="hud-controls">
            <button class="btn-tac" style="background:#9f1239; border-color:#f43f5e;" onclick="closeCameraHUD()">✖ FECHAR MIRA</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializa o mapa centralizado em Águas Formosas
        const map = L.map('map', { zoomControl: false }).setView([-17.0822, -40.9352], 14);

        // Servidor OpenStreetMap Público e Gratuito (Sem API Key)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Raio de alcance tático no mapa
        L.circle([-17.0822, -40.9352], {
            color: '#0284c7',
            fillColor: '#0284c7',
            fillOpacity: 0.25,
            radius: 1500
        }).addTo(map);

        // Controle da Câmera PTZ / HUD
        let mediaStream = null;
        async function openCameraHUD() {
            const modal = document.getElementById('camera-hud-modal');
            const video = document.getElementById('camera-video');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = mediaStream;
                modal.style.display = 'flex';
            } catch (err) {
                alert("Não foi possível acessar a câmera do dispositivo.");
            }
        }

        function closeCameraHUD() {
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            document.getElementById('camera-hud-modal').style.display = 'none';
        }
    </script>
</body>
</html>
