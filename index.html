<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DedroneTracker.AI - C2 PRO</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-base: #030712; --glass-bg: rgba(17, 24, 39, 0.75); --glass-border: rgba(56, 189, 248, 0.3);
            --cyan: #38bdf8; --cyan-glow: rgba(56, 189, 248, 0.6);
            --red: #f43f5e; --red-glow: rgba(244, 63, 94, 0.8);
            --green: #10b981; --yellow: #f59e0b;
            --text-main: #f8fafc; --text-muted: #64748b;
            --font-ui: 'Rajdhani', sans-serif; --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { height: 100%; width: 100%; font-family: var(--font-ui); background: var(--bg-base); color: var(--text-main); overflow: hidden; }

        #app-container { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: flex; width: 100%; }
        #map { width: 100%; height: 100%; background: #030712; z-index: 1000; }
        #map::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; z-index:1500; pointer-events:none; background-image: linear-gradient(rgba(56,189,248,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,0.05) 1px, transparent 1px); background-size: 40px 40px; }

        /* ALARME GLOBAL CRÍTICO */
        #critical-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px var(--red); z-index: 9999;
            pointer-events: none; display: none; animation: flashRed 1s infinite alternate;
        }
        @keyframes flashRed { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }

        /* PAINEL LATERAL ESQUERDO */
        #sidebar {
            position: absolute; top: 10px; left: 10px; bottom: 10px; width: 380px;
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            border-radius: 12px; display: flex; flex-direction: column; z-index: 3000; padding: 15px; gap: 15px;
            overflow-y: auto; box-shadow: 2px 0 20px rgba(0,0,0,0.5);
        }

        .header-title { font-family: var(--font-mono); font-size: 16px; color: var(--cyan); text-align: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; margin-bottom: 5px;}

        .widget { background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; position: relative; }
        .widget::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--cyan); }
        .widget.alert-active { border-color: var(--red); background: rgba(244, 63, 94, 0.1); }
        .widget.alert-active::before { background: var(--red); box-shadow: 0 0 10px var(--red); }

        .widget-header { font-size: 12px; letter-spacing: 1px; color: var(--cyan); margin-bottom: 10px; font-weight: 700; display: flex; justify-content: space-between; }
        
        .btn-cyber {
            background: linear-gradient(90deg, #0f172a, #1e293b); border: 1px solid var(--glass-border); color: #fff;
            padding: 10px; font-family: var(--font-mono); font-size: 12px; border-radius: 6px; cursor: pointer; width: 100%;
            display: flex; justify-content: space-between; margin-bottom: 8px; transition: 0.3s;
        }
        .btn-cyber.active { border-color: var(--cyan); background: rgba(14, 165, 233, 0.2); color: var(--cyan); box-shadow: inset 0 0 10px rgba(14, 165, 233, 0.2);}
        
        /* LOG DE AMEAÇAS PERSISTENTE */
        #threat-log { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .log-item { background: rgba(244, 63, 94, 0.15); border-left: 3px solid var(--red); padding: 8px; font-family: var(--font-mono); font-size: 11px; }
        .log-item span.time { color: var(--yellow); }
        .log-item span.type { color: var(--red); font-weight: bold; }
        
        .btn-ack { background: var(--red); color: white; border: none; padding: 10px; font-family: var(--font-ui); font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; animation: pulse 1.5s infinite; }
        .btn-ack:active { transform: scale(0.98); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--red-glow); } 70% { box-shadow: 0 0 0 10px rgba(244,63,94,0); } 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); } }

        /* HUD CÂMERA */
        #cam-hud { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9000; display: none; }
        #cam-video { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0.7;}
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; border: 2px solid var(--cyan); border-radius: 50%; pointer-events: none; z-index: 9002; display: flex; align-items: center; justify-content: center;}
        .crosshair::after { content: '+'; color: var(--cyan); font-size: 24px; }
        .cam-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9003; display: flex; gap: 20px;}
        .btn-hud { background: rgba(3,7,18,0.8); border: 1px solid var(--cyan); color: var(--cyan); padding: 15px 30px; font-family: var(--font-mono); cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Camada que pisca a tela toda de vermelho -->
    <div id="critical-overlay"></div>

    <div id="app-container">
        <div id="sidebar">
            <div class="header-title">NEXUS C2 // SENSOR FUSION</div>

            <div class="widget">
                <div class="widget-header">CONTROLE DE SENSORES</div>
                <button class="btn-cyber" id="btn-adsb" onclick="toggleADSB()">
                    [1] RADAR ADS-B (Aviação) <span id="adsb-ind">OFF</span>
                </button>
                <button class="btn-cyber" id="btn-sdr">
                    [2] SDR REMOTE ID (RF) <span style="color:var(--yellow)">CONECTAR PYTHON</span>
                </button>
                <button class="btn-cyber" id="btn-yolo" onclick="openCam()">
                    [3] MIRA ÓPTICA (YOLOv8) <span>OFF</span>
                </button>
            </div>

            <!-- LOG PERSISTENTE - ESTE É O CORAÇÃO DA DETECÇÃO -->
            <div class="widget" id="alert-widget">
                <div class="widget-header" style="color: var(--red);">LOG TÁTICO DE AMEAÇAS</div>
                <div id="threat-log">
                    <!-- Logs vão aparecer aqui e não vão sumir -->
                    <div style="color: var(--text-muted); font-size: 11px; font-family: var(--font-mono);">Nenhum alvo detectado no setor.</div>
                </div>
                <button class="btn-ack" id="btn-ack" style="display: none;" onclick="acknowledgeThreats()">RECONHECER AMEAÇAS</button>
            </div>

            <div class="widget">
                <div class="widget-header">TELEMETRIA GPS</div>
                <div style="font-family: var(--font-mono); font-size: 12px; color: var(--cyan);" id="gps-data">Buscando satélites...</div>
            </div>
            
            <!-- BOTÃO DE TESTE PARA VOCÊ VER A AMEAÇA NA TELA -->
            <button class="btn-cyber" onclick="simulateDroneThreat()" style="border-color: var(--yellow); color: var(--yellow); text-align: center; justify-content: center; margin-top: auto;">
                ⚠️ INJETAR AMEAÇA FANTASMA (TESTE)
            </button>
        </div>

        <div id="map"></div>
    </div>

    <!-- CÂMERA HUD -->
    <div id="cam-hud">
        <video id="cam-video" autoplay playsinline muted></video>
        <div class="crosshair"></div>
        <div class="cam-overlay">
            <button class="btn-hud" style="color: var(--red); border-color: var(--red);" onclick="closeCam()">FECHAR CÂMERA</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 1. MAPA E LOCALIZAÇÃO COM MARCADOR VISUAL
        // ==========================================
        const map = L.map('map', { zoomControl: false }).setView([-15.79, -47.88], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

        let userCoords = null;
        let userMarker = null; // Variável para segurar o ícone da sua base

        navigator.geolocation.watchPosition(
            pos => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                
                // Atualiza os dados no painel lateral esquerdo
                document.getElementById('gps-data').innerText = `LAT: ${pos.coords.latitude.toFixed(5)}\nLNG: ${pos.coords.longitude.toFixed(5)}\nACC: ${Math.round(pos.coords.accuracy)}m`;
                
                // Move a câmera do mapa para você
                map.setView(userCoords, 16);

                // Cria ou atualiza o seu marcador visual no mapa
                if (!userMarker) {
                    const baseIcon = L.divIcon({
                        className: '',
                        html: `<div style="width: 18px; height: 18px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 15px var(--cyan); border: 2px solid white;"></div>`,
                        iconSize: [18, 18],
                        iconAnchor: [9, 9]
                    });
                    userMarker = L.marker(userCoords, {icon: baseIcon}).addTo(map).bindPopup("<b style='color:black;'>📍 BASE C2 ATIVA</b>");
                } else {
                    userMarker.setLatLng(userCoords); // Se você se mover, o pino anda junto
                }
            }, 
            error => {
                // Se o navegador bloquear ou não tiver sinal de GPS, avisa na tela!
                console.error("Falha no GPS: ", error);
                document.getElementById('gps-data').innerHTML = `<span style="color: var(--red);">SINAL GPS PERDIDO:<br>${error.message}</span><br><span style="font-size:10px;">Verifique a permissão do navegador</span>`;
            }, 
            { enableHighAccuracy: true }
        );

        // ==========================================
        // 2. SISTEMA DE LOG E ALARME PERSISTENTE
        // ==========================================
        let unacknowledgedThreats = 0;

        function logThreat(type, desc, distance) {
            unacknowledgedThreats++;
            document.getElementById('critical-overlay').style.display = 'block';
            document.getElementById('alert-widget').classList.add('alert-active');
            document.getElementById('btn-ack').style.display = 'block';
            
            const logContainer = document.getElementById('threat-log');
            if(unacknowledgedThreats === 1) logContainer.innerHTML = ''; // Limpa o "Nenhum alvo"

            const time = new Date().toLocaleTimeString();
            const logHTML = `
                <div class="log-item">
                    <span class="time">[${time}]</span> <span class="type">${type}</span><br>
                    INFO: ${desc}<br>
                    DISTÂNCIA EST.: ${distance}
                </div>
            `;
            logContainer.insertAdjacentHTML('afterbegin', logHTML);
            
            // Toca alarme sonoro
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator(); osc.type = 'square'; 
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.connect(audioCtx.destination); 
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function acknowledgeThreats() {
            unacknowledgedThreats = 0;
            document.getElementById('critical-overlay').style.display = 'none';
            document.getElementById('alert-widget').classList.remove('alert-active');
            document.getElementById('btn-ack').style.display = 'none';
            document.getElementById('threat-log').innerHTML = '<div style="color: var(--text-muted); font-size: 11px; font-family: var(--font-mono);">Setor limpo. Ameaças reconhecidas.</div>';
        }

        function simulateDroneThreat() {
            logThreat("UAS DETECTADO (RF)", "DJI Mavic 3 (OcuSync 3.0) MAC: 60:60:1F:...", "850m - Aproximação");
        }

        // ==========================================
        // 3. RADAR DE AVIAÇÃO (ADS-B) COM SIMULAÇÃO
        // ==========================================
        let adsbInt; let planesLayer = L.layerGroup().addTo(map); let adsbOn = false;
        
        async function toggleADSB() {
            adsbOn = !adsbOn; const btn = document.getElementById('btn-adsb');
            if(adsbOn) { 
                btn.classList.add('active'); 
                document.getElementById('adsb-ind').innerText = "ON"; 
                fetchPlanes(); 
                adsbInt = setInterval(fetchPlanes, 15000); 
            } else { 
                btn.classList.remove('active'); 
                document.getElementById('adsb-ind').innerText = "OFF"; 
                clearInterval(adsbInt); 
                planesLayer.clearLayers(); 
            }
        }
        
        async function fetchPlanes() {
            if(!userCoords) return; 
            const [lat, lng] = userCoords;
            try {
                // Busca aviões reais na API OpenSky
                const res = await fetch(`https://opensky-network.org/api/states/all?lamin=${lat-1.5}&lomin=${lng-1.5}&lamax=${lat+1.5}&lomax=${lng+1.5}`);
                const data = await res.json(); 
                planesLayer.clearLayers();
                let found = false;
                
                if(data.states) {
                    data.states.forEach(p => {
                        if(p[6]&&p[5]) {
                            found = true;
                            const icn = L.divIcon({ className:'', html:`<div style="transform:rotate(${p[10]-45}deg);font-size:20px;">✈️</div>`, iconSize:[24,24] });
                            L.marker([p[6],p[5]], {icon:icn}).bindPopup(`<b>${p[1]||'UNK'}</b><br>Alt:${Math.round(p[7]||0)}m`).addTo(planesLayer);
                        }
                    });
                }
                
                // Se não achar avião real, injeta um FALSO para você ver que o mapa e a função operam
                if(!found) {
                    console.log("Céu vazio na API pública. Injetando avião simulado para teste de sistema.");
                    const icn = L.divIcon({ className:'', html:`<div style="transform:rotate(90deg);font-size:20px;">✈️</div>`, iconSize:[24,24] });
                    L.marker([lat + 0.01, lng + 0.01], {icon:icn}).bindPopup(`<b>VOO COMERCIAL (SIMULADO)</b><br>Alt: 3500m`).addTo(planesLayer);
                }
            } catch(e) { console.error("Erro na busca ADS-B", e); }
        }

        // ==========================================
        // 4. MIRA ÓPTICA (YOLOv8 PREP)
        // ==========================================
        let stream;
        async function openCam() {
            document.getElementById('cam-hud').style.display='block';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }});
                document.getElementById('cam-video').srcObject = stream;
            } catch(e) {
                alert("Erro ao abrir câmera: " + e.message);
                closeCam();
            }
        }
        function closeCam() {
            document.getElementById('cam-hud').style.display='none';
            if(stream) stream.getTracks().forEach(t=>t.stop());
        }
    </script>
</body>
</html>
