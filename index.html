<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DedroneTracker.AI - Tático Avançado</title>
    
    <meta name="theme-color" content="#070a11">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        :root {
            --bg-dark: #070a11; --panel-bg: rgba(11, 17, 32, 0.85);
            --border-color: rgba(30, 41, 59, 0.8); --accent-cyan: #0ea5e9;
            --accent-red: #ef4444; --accent-green: #10b981; --accent-yellow: #f59e0b;
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-main); overflow: hidden; position: fixed; }

        #header {
            height: calc(48px + env(safe-area-inset-top, 0px)); width: 100%; 
            background: rgba(7, 10, 17, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--accent-cyan);
            display: flex; align-items: flex-end; justify-content: space-between; 
            padding: 10px 15px; position: absolute; top: 0; left: 0; z-index: 4000;
        }
        .logo { font-weight: 900; font-size: 12px; color: #fff; letter-spacing: 1px; }
        .logo span { color: var(--accent-cyan); }
        .status-container { display: flex; gap: 6px; }
        .status-badge { font-size: 9px; font-weight: 700; color: var(--accent-green); background: rgba(16,185,129,0.15); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--accent-green); }

        #app-container { position: absolute; top: calc(48px + env(safe-area-inset-top, 0px)); bottom: 0; left: 0; right: 0; display: flex; width: 100%; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #070a11; z-index: 1000; }

        #sidebar {
            width: 320px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 3000; padding: 15px; gap: 12px;
            overflow-y: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .panel-block { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .panel-title { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--accent-cyan); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .target-data { font-size: 11px; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .target-data span { color: var(--text-main); font-weight: bold; }

        .btn-sensor { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; color: #fff; padding: 12px; font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 8px; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .btn-sensor:active { transform: scale(0.98); }
        .btn-sensor.active { background: rgba(16,185,129,0.2); border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px rgba(16,185,129,0.2); }
        .btn-sensor.scanning { background: rgba(245,158,11,0.2); border-color: var(--accent-yellow); color: var(--accent-yellow); }
        
        .btn-tac { background: var(--accent-cyan); color: #000; padding: 14px; font-size: 12px; font-weight: 900; letter-spacing: 1px; border-radius: 8px; border: none; cursor: pointer; width: 100%; margin-top: 5px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }
        .btn-tac:active { transform: scale(0.98); }
        .btn-close { background: transparent; border: 1px solid #475569; color: #94a3b8; box-shadow: none; }

        #panel-toggle-btn { position: absolute; top: 15px; left: 15px; z-index: 2000; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 10px 15px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #locate-btn { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 15px; z-index: 2000; background: var(--accent-cyan); border: none; color: #000; padding: 12px 18px; border-radius: 30px; font-size: 11px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }

        @media (max-width: 768px) {
            #sidebar { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: translateY(100%); border-right: none; padding-bottom: env(safe-area-inset-bottom, 20px); }
            #sidebar.open { transform: translateY(0); }
        }

        #camera-hud-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9000; display: none; overflow: hidden; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 9001; transition: filter 0.3s; }
        .night-vision { filter: contrast(1.5) brightness(1.3) sepia(1) hue-rotate(55deg) saturate(3) !important; }
        #ai-canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 9002; pointer-events: none; }
        .hud-top-bar { position: absolute; top: calc(15px + env(safe-area-inset-top, 0px)); left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 9003; pointer-events: none; }
        .hud-alert { color: var(--accent-cyan); font-weight: 800; font-size: 11px; letter-spacing: 1px; text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent-cyan); }
        .hud-compass { color: var(--accent-green); font-weight: 900; font-size: 14px; text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; }
        .hud-controls-bottom { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 15px; right: 15px; display: flex; gap: 10px; z-index: 9004; }
        .btn-hud { flex: 1; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; border: none; }
        .btn-nv { background: rgba(16, 185, 129, 0.8); color: #000; backdrop-filter: blur(5px); }
        .btn-nv.active { background: #10b981; box-shadow: 0 0 15px #10b981; border: 2px solid #fff; }
        .btn-close-cam { background: rgba(239, 68, 68, 0.8); color: #fff; backdrop-filter: blur(5px); border: 1px solid #f87171; }
        
        .plane-icon { background: none; border: none; font-size: 18px; text-shadow: 0 0 5px #000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="header">
        <div class="logo"><span>[✖] MULTISENSOR</span> C2 MOBILE</div>
        <div class="status-container">
            <div class="status-badge" id="ai-status">🧠 IA SETUP</div>
            <div class="status-badge" id="gps-status">● GPS SETUP</div>
        </div>
    </div>

    <div id="app-container">
        <button id="panel-toggle-btn" onclick="toggleSidebar()">📊 ABRIR PAINEL TÁTICO</button>

        <div id="sidebar">
            <div class="panel-block">
                <div class="panel-title">📡 SENSORES DE AMBIENTE</div>
                <button class="btn-sensor" id="btn-adsb" onclick="toggleADSB()">
                    <span>✈️ RADAR ADS-B (AVIÕES)</span> <span id="adsb-status">OFF</span>
                </button>
                <button class="btn-sensor" id="btn-audio" onclick="toggleAcousticRadar()">
                    <span>🔊 RADAR ACÚSTICO</span> <span id="audio-status">OFF</span>
                </button>
                <button class="btn-sensor" id="btn-voice" onclick="toggleVoiceAlerts()">
                    <span>🗣️ ALERTA DE VOZ / PUSH</span> <span id="voice-status">OFF</span>
                </button>
            </div>

            <div class="panel-block">
                <div class="panel-title" style="color: var(--accent-red);">⚠️ ALVO DETECTADO</div>
                <div class="target-data">
                    <div>FONTE: <span id="tgt-source" style="color:var(--accent-red)">NENHUMA</span></div>
                    <div>CONFIANÇA: <span id="tgt-conf">--%</span></div>
                    <div>ASSINATURA: <span id="tgt-freq">--</span></div>
                    <div>DISTÂNCIA: <span id="tgt-dist">-- m</span></div>
                </div>
            </div>

            <div class="panel-block">
                <div class="panel-title">📍 SISTEMA INERCIAL (BASE)</div>
                <div class="target-data">
                    <div>COORD: <span id="gps-coords">Buscando...</span></div>
                    <div>PRECISÃO: <span id="gps-accuracy">-- m</span></div>
                </div>
            </div>

            <button class="btn-tac" onclick="openCameraHUD()">📷 ATIVAR MIRA (CÂMERA + IA)</button>
            <button class="btn-tac btn-close" onclick="toggleSidebar()">✖ MINIMIZAR PAINEL</button>
        </div>

        <button id="locate-btn" onclick="centerOnGPS()">🎯 CENTRALIZAR</button>
        <div id="map"></div>
    </div>

    <!-- HUD DA CÂMERA -->
    <div id="camera-hud-modal">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="ai-canvas"></canvas>
        <div class="hud-top-bar">
            <div class="hud-alert" id="hud-alert">Escaneando setor visual...</div>
            <div class="hud-compass" id="hud-compass">0° N</div>
        </div>
        <div class="hud-controls-bottom">
            <button class="btn-hud btn-nv" id="btn-night-vision" onclick="toggleNightVision()">🌙 VISÃO NOTURNA</button>
            <button class="btn-hud btn-close-cam" onclick="closeCameraHUD()">✖ ENCERRAR CÂMERA</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 🛡️ API ANTI-BLOQUEIO DE TELA
        let wakeLock = null;
        async function requestWakeLock() { try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {} }
        document.addEventListener('visibilitychange', () => { if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock(); });
        requestWakeLock();

        // 📳 ALERTA TÁTIL & VOZ & PUSH NOTIFICATION
        let isVoiceActive = false;
        let lastAlertTime = 0;

        function toggleVoiceAlerts() {
            isVoiceActive = !isVoiceActive;
            const btn = document.getElementById('btn-voice');
            if (isVoiceActive) {
                btn.classList.add('active'); document.getElementById('voice-status').innerText = "ON";
                if (Notification.permission !== "granted") Notification.requestPermission();
                speakText("Sistema de alerta por voz e notificações ativado.");
            } else {
                btn.classList.remove('active'); document.getElementById('voice-status').innerText = "OFF";
            }
        }

        function speakText(text) {
            if (!isVoiceActive || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR'; utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function sendPushNotification(title, body) {
            if (Notification.permission === "granted" && document.visibilityState !== "visible") {
                new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/7902/7902125.png' });
            }
        }

        function registerThreat(source, conf, sig, dist) {
            document.getElementById('tgt-source').innerText = source;
            document.getElementById('tgt-conf').innerText = conf;
            document.getElementById('tgt-freq').innerText = sig;
            document.getElementById('tgt-dist').innerText = dist;
            
            let now = Date.now();
            if (now - lastAlertTime > 10000) { // Limita alertas para não floodar (a cada 10s)
                if("vibrate" in navigator) navigator.vibrate([300, 100, 300, 100, 500]);
                speakText(`Atenção! Alvo detectado por ${source}. Confiança de ${conf}.`);
                sendPushNotification("⚠️ Alvo Aéreo Detectado", `Fonte: ${source} | Sig: ${sig}`);
                lastAlertTime = now;
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        // MAPA & GPS
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
        const map = L.map('map', { zoomControl: false, layers: [satelliteLayer] }).setView([-17.25, -41.00], 15);
        L.control.zoom({ position: 'topright' }).addTo(map);

        let userCoords = null; let userMarker = null;
        const baseIcon = L.divIcon({ className: 'custom-div-icon', html: "<div style='background-color:var(--accent-cyan); width:18px; height:18px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 15px var(--accent-cyan);'></div>", iconSize: [18, 18], iconAnchor: [9, 9] });

        navigator.geolocation.watchPosition(pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            document.getElementById('gps-status').innerText = "● GPS ACTV";
            document.getElementById('gps-coords').innerText = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            document.getElementById('gps-accuracy').innerText = `${Math.round(pos.coords.accuracy)} m`;
            if(!userMarker) { userMarker = L.marker(userCoords, {icon: baseIcon}).addTo(map); map.setView(userCoords, 14); } 
            else { userMarker.setLatLng(userCoords); }
        }, err => console.error(err), { enableHighAccuracy: true });

        function centerOnGPS() { if(userCoords) map.flyTo(userCoords, 15, {animate: true}); if("vibrate" in navigator) navigator.vibrate([50]); }

        // ✈️ RADAR ADS-B (Aviões reais)
        let isAdsbActive = false;
        let adsbInterval;
        let planesLayer = L.layerGroup().addTo(map);

        async function toggleADSB() {
            const btn = document.getElementById('btn-adsb');
            isAdsbActive = !isAdsbActive;
            if (isAdsbActive) {
                btn.classList.add('active'); document.getElementById('adsb-status').innerText = "ON";
                fetchPlanes(); adsbInterval = setInterval(fetchPlanes, 15000); // Atualiza a cada 15s
            } else {
                btn.classList.remove('active'); document.getElementById('adsb-status').innerText = "OFF";
                clearInterval(adsbInterval); planesLayer.clearLayers();
            }
        }

        async function fetchPlanes() {
            if (!userCoords) return;
            // Bounding box de aprox. 30km ao redor do usuário
            const latMin = userCoords[0] - 0.3, latMax = userCoords[0] + 0.3;
            const lonMin = userCoords[1] - 0.3, lonMax = userCoords[1] + 0.3;
            try {
                const response = await fetch(`https://opensky-network.org/api/states/all?lamin=${latMin}&lomin=${lonMin}&lamax=${latMax}&lomax=${lonMax}`);
                const data = await response.json();
                planesLayer.clearLayers();
                
                if (data.states && data.states.length > 0) {
                    data.states.forEach(plane => {
                        const [icao, callsign, origin, time, last_contact, lng, lat, baro_alt, on_ground, vel, true_track] = plane;
                        if(lat && lng && !on_ground) {
                            const icon = L.divIcon({
                                className: 'plane-icon',
                                html: `<div style="transform: rotate(${true_track - 45}deg); font-size: 24px;">✈️</div>`,
                                iconSize: [30, 30]
                            });
                            L.marker([lat, lng], {icon}).bindPopup(`<b>Voo: ${callsign || 'N/A'}</b><br>Alt: ${baro_alt || 0}m<br>Vel: ${Math.round(vel * 3.6)} km/h`).addTo(planesLayer);
                            
                            // Se estiver muito baixo e perto, alerta.
                            if (baro_alt < 1500) {
                                registerThreat("ADS-B (AERONAVE)", "100%", `VOO ${callsign || icao}`, `Alt: ${Math.round(baro_alt)}m`);
                            }
                        }
                    });
                }
            } catch (e) { console.log("Erro ao buscar ADS-B", e); }
        }

        // TENSORFLOW IA & CÂMERA
        let aiModel = null, isDetecting = false, currentStream = null;
        let videoEl = document.getElementById('camera-video'), canvasEl = document.getElementById('ai-canvas'), ctx = canvasEl.getContext('2d');

        cocoSsd.load().then(model => { aiModel = model; document.getElementById('ai-status').innerText = "● IA PRONTA"; });

        async function openCameraHUD() {
            document.getElementById('camera-hud-modal').style.display = 'block'; toggleSidebar();
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } });
                videoEl.srcObject = currentStream;
                videoEl.onloadedmetadata = () => { canvasEl.width = videoEl.videoWidth; canvasEl.height = videoEl.videoHeight; isDetecting = true; detectFrame(); };
            } catch(e) { alert("Erro na câmera: " + e); closeCameraHUD(); }
        }

        function closeCameraHUD() { isDetecting = false; if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); currentStream = null; } videoEl.srcObject = null; document.getElementById('camera-hud-modal').style.display = 'none'; }

        let isNightVision = false;
        function toggleNightVision() {
            isNightVision = !isNightVision; const btn = document.getElementById('btn-night-vision');
            if(isNightVision) { videoEl.classList.add('night-vision'); btn.classList.add('active'); btn.innerText = "🟩 VISÃO NOTURNA: ON"; } 
            else { videoEl.classList.remove('night-vision'); btn.classList.remove('active'); btn.innerText = "🌙 VISÃO NOTURNA: OFF"; }
        }

        window.addEventListener('deviceorientation', function(e) {
            if(!isDetecting) return;
            let heading = e.webkitCompassHeading || Math.abs(e.alpha - 360);
            if(heading) {
                let dir = "N"; if(heading>45&&heading<=135) dir="L"; else if(heading>135&&heading<=225) dir="S"; else if(heading>225&&heading<=315) dir="O";
                document.getElementById('hud-compass').innerText = `${heading.toFixed(0)}° ${dir}`;
            }
        });

        async function detectFrame() {
            if (!isDetecting || !aiModel) return;
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
            const predictions = await aiModel.detect(videoEl);
            let droneSpotted = false;
            predictions.forEach(pred => {
                if (['bird', 'airplane', 'kite'].includes(pred.class)) {
                    droneSpotted = true;
                    ctx.beginPath(); ctx.rect(...pred.bbox); ctx.lineWidth = 3; ctx.strokeStyle = '#ef4444'; ctx.stroke();
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.8)'; ctx.fillRect(pred.bbox[0], pred.bbox[1] - 25, 220, 20);
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(`UAV SUSPEITO - ${(pred.score*100).toFixed(0)}%`, pred.bbox[0] + 5, pred.bbox[1] - 10);
                    registerThreat("IA ÓPTICA", `${(pred.score*100).toFixed(0)}%`, pred.class.toUpperCase(), "Linha de Visada");
                }
            });

            const hudAlert = document.getElementById('hud-alert');
            if(droneSpotted) { hudAlert.innerText = "⚠️ ANOMALIA AÉREA DETECTADA!"; hudAlert.style.color = "#ef4444"; hudAlert.style.borderColor = "#ef4444"; } 
            else { hudAlert.innerText = isNightVision ? "🟩 Modo Noturno Escaneando..." : "Escaneando setor visual..."; hudAlert.style.color = isNightVision ? "#10b981" : "var(--accent-cyan)"; hudAlert.style.borderColor = isNightVision ? "#10b981" : "var(--accent-cyan)"; }
            if(isDetecting) requestAnimationFrame(detectFrame);
        }

        // SONAR ACÚSTICO
        let audioCtx, analyser, audioStream, audioInterval; let isAudioActive = false;
        async function toggleAcousticRadar() {
            const btn = document.getElementById('btn-audio');
            if (isAudioActive) {
                clearInterval(audioInterval); if(audioStream) audioStream.getTracks().forEach(t => t.stop());
                if(audioCtx) audioCtx.close(); isAudioActive = false; btn.classList.remove('active'); document.getElementById('audio-status').innerText = "OFF"; return;
            }
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
                audioCtx.createMediaStreamSource(audioStream).connect(analyser);
                isAudioActive = true; btn.classList.add('active'); document.getElementById('audio-status').innerText = "ON";
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray); let sum = 0; for(let i = 200; i < 300; i++) sum += dataArray[i]; let avg = sum / 100;
                    if (avg > 70) { btn.style.boxShadow = "0 0 15px #ef4444"; registerThreat("SONAR ACÚSTICO", `${Math.min(100, avg).toFixed(1)}%`, "Hélices Alta RPM", "Aproximação"); } 
                    else { btn.style.boxShadow = ""; }
                }, 800);
            } catch(e) { alert("Microfone negado."); }
        }
    </script>
</body>
</html>
